services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: estacionamento
      POSTGRES_USER: estacionamento
      POSTGRES_PASSWORD: ${DB_PASSWORD:-estacionamento}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estacionamento -d estacionamento"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - parking-data:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://database:5432/estacionamento
      DB_USERNAME: estacionamento
      DB_PASSWORD: ${DB_PASSWORD:-estacionamento}
      PARKING_ADMIN_TOKEN: ${PARKING_ADMIN_TOKEN:-demo-admin-token}
      PARKING_DEMO_DATA: "true"
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}

volumes:
  parking-data:
